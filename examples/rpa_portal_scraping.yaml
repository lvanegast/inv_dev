id: rpa-portal-scraping
name: "RPA Operativo: Login y Extracción en Portal Web Real"
description: "Automatización real con Playwright: entra a un portal web en internet (quotes.toscrape.com/login), llena las credenciales del formulario, hace clic en Enviar, verifica el inicio de sesión y toma una captura de pantalla real del sitio."
status: active

trigger:
  id: rpa_trigger
  name: "Disparador de Acceso Operativo"
  type: trigger_webhook
  config:
    example_payload:
      username: "operador_central"
      departamento: "Mesa de Operaciones"

nodes:
  # 1. Automatización Robótica en Vivo con Playwright
  - id: execute_browser_automation
    name: "RPA: Iniciar Sesión en Portal Real"
    type: action_browser
    config:
      url: "https://quotes.toscrape.com/login"
      headless: true
      timeout_ms: 15000
      actions:
        - action: "wait_for_selector"
          selector: "#username"
        - action: "fill"
          selector: "#username"
          value: "{{trigger.body.username}}"
        - action: "fill"
          selector: "#password"
          value: "ClaveOperador2026!"
        - action: "click"
          selector: "input[type='submit']"
        - action: "wait_for_selector"
          selector: "a[href='/logout']"
        - action: "extract_text"
          selector: ".quote .text"
          key: "cita_destacada"
        - action: "extract_text"
          selector: ".quote .author"
          key: "autor_cita"
        - action: "extract_text"
          selector: "a[href='/logout']"
          key: "estado_sesion"
        - action: "screenshot"
          path: "screenshots/portal_real_{{trigger.body.username}}.png"

  # 2. Consolidar datos extraídos
  - id: format_rpa_summary
    name: "Transform: Consolidar Datos de RPA"
    type: action_transform
    config:
      operador: "{{trigger.body.username}}"
      autor: "{{execute_browser_automation.extracted.autor_cita}}"
      cita: "{{execute_browser_automation.extracted.cita_destacada}}"
      sesion: "{{execute_browser_automation.extracted.estado_sesion}}"
      pantallazo: "{{execute_browser_automation.screenshot_url}}"

  # 3. Guardar registro en la base de datos de auditoría
  - id: init_rpa_db
    name: "SQL: Crear Tabla de Auditoría RPA"
    type: action_sql
    config:
      query: "CREATE TABLE IF NOT EXISTS rpa_records (id INTEGER PRIMARY KEY AUTOINCREMENT, ticket TEXT UNIQUE, operator TEXT, auth_code TEXT, status TEXT, screenshot TEXT, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"

  - id: save_rpa_record
    name: "SQL: Guardar Trámite RPA"
    type: action_sql
    config:
      query: "INSERT INTO rpa_records (ticket, operator, auth_code, status, screenshot) VALUES (?, ?, ?, ?, ?) ON CONFLICT(ticket) DO UPDATE SET operator=excluded.operator, auth_code=excluded.auth_code, status=excluded.status, screenshot=excluded.screenshot, created_at=CURRENT_TIMESTAMP;"
      params:
        - "{{format_rpa_summary.operador}}"
        - "{{format_rpa_summary.operador}}"
        - "{{format_rpa_summary.autor}}"
        - "{{format_rpa_summary.sesion}}"
        - "{{format_rpa_summary.pantallazo}}"

  # 4. Registrar en el log del sistema
  - id: log_rpa_completion
    name: "Log: Auditoría Final RPA"
    type: action_log
    config:
      level: info
      message: "Sesión iniciada con éxito en portal real quotes.toscrape.com por {{trigger.body.username}}. Autor extraído: {{execute_browser_automation.extracted.autor_cita}}. Captura: {{execute_browser_automation.screenshot_url}}"

edges:
  - source: rpa_trigger
    target: execute_browser_automation

  - source: execute_browser_automation
    target: format_rpa_summary

  - source: format_rpa_summary
    target: init_rpa_db

  - source: init_rpa_db
    target: save_rpa_record

  - source: save_rpa_record
    target: log_rpa_completion
