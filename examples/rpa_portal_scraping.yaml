id: rpa-portal-scraping
name: "RPA Operativo: Validación de Trámites en Portal ERP"
description: "Automatización de tareas del personal operativo con Playwright: abre el Portal Corporativo ERP, introduce el folio de factura, operador y proveedor, hace clic en Procesar Trámite, valida la aprobación fiscal y captura el comprobante en pantalla."
status: active

trigger:
  id: rpa_trigger
  name: "Disparador de Trámite Operativo"
  type: trigger_webhook
  config:
    example_payload:
      ticket_id: "FAC-2026-901"
      operador: "Marta Gómez"
      proveedor: "Corporación Acero Andino S.A."

nodes:
  # 1. Automatización Robótica en Vivo con Playwright
  - id: execute_browser_automation
    name: "RPA: Procesar Trámite en Portal ERP"
    type: action_browser
    config:
      url: "http://127.0.0.1:8000/portal-operativo"
      headless: true
      timeout_ms: 15000
      actions:
        - action: "wait_for_selector"
          selector: "#ticket_id"
        - action: "fill"
          selector: "#ticket_id"
          value: "{{trigger.body.ticket_id}}"
        - action: "fill"
          selector: "#operador"
          value: "{{trigger.body.operador}}"
        - action: "fill"
          selector: "#proveedor"
          value: "{{trigger.body.proveedor}}"
        - action: "click"
          selector: "#btn_procesar"
        - action: "wait_for_selector"
          selector: "#resultado_tramite"
        - action: "extract_text"
          selector: "#estado_aprobacion"
          key: "estado_tramite"
        - action: "extract_text"
          selector: "#folio_fiscal"
          key: "folio_fiscal"
        - action: "extract_text"
          selector: "#mensaje_confirmacion"
          key: "mensaje_confirmacion"
        - action: "screenshot"
          path: "screenshots/comprobante_erp_{{trigger.body.ticket_id}}.png"

  # 2. Consolidar datos extraídos
  - id: format_rpa_summary
    name: "Transform: Consolidar Datos de RPA"
    type: action_transform
    config:
      ticket: "{{trigger.body.ticket_id}}"
      operador: "{{trigger.body.operador}}"
      proveedor: "{{trigger.body.proveedor}}"
      estado: "{{execute_browser_automation.extracted.estado_tramite}}"
      folio: "{{execute_browser_automation.extracted.folio_fiscal}}"
      pantallazo: "{{execute_browser_automation.screenshot_url}}"

  # 3. Guardar registro en la base de datos de auditoría
  - id: init_rpa_db
    name: "SQL: Crear Tabla de Auditoría RPA"
    type: action_sql
    config:
      query: "CREATE TABLE IF NOT EXISTS rpa_records (id INTEGER PRIMARY KEY AUTOINCREMENT, ticket TEXT UNIQUE, operator TEXT, auth_code TEXT, status TEXT, screenshot TEXT, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"

  - id: save_rpa_record
    name: "SQL: Guardar Trámite RPA"
    type: action_sql
    config:
      query: "INSERT INTO rpa_records (ticket, operator, auth_code, status, screenshot) VALUES (?, ?, ?, ?, ?) ON CONFLICT(ticket) DO UPDATE SET operator=excluded.operator, auth_code=excluded.auth_code, status=excluded.status, screenshot=excluded.screenshot, created_at=CURRENT_TIMESTAMP;"
      params:
        - "{{format_rpa_summary.ticket}}"
        - "{{format_rpa_summary.operador}}"
        - "{{format_rpa_summary.folio}}"
        - "{{format_rpa_summary.estado}}"
        - "{{format_rpa_summary.pantallazo}}"

  # 4. Registrar en el log del sistema
  - id: log_rpa_completion
    name: "Log: Auditoría Final RPA"
    type: action_log
    config:
      level: info
      message: "Trámite {{trigger.body.ticket_id}} autorizado con éxito en portal ERP para {{trigger.body.proveedor}}. Folio: {{execute_browser_automation.extracted.folio_fiscal}}. Evidencia: {{execute_browser_automation.screenshot_url}}"

edges:
  - source: rpa_trigger
    target: execute_browser_automation

  - source: execute_browser_automation
    target: format_rpa_summary

  - source: format_rpa_summary
    target: init_rpa_db

  - source: init_rpa_db
    target: save_rpa_record

  - source: save_rpa_record
    target: log_rpa_completion
