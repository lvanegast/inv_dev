id: rpa-portal-scraping
name: "RPA Operativo: Monitoreo de Precios en Tienda E-Commerce Real"
description: "Automatización de compras e inventario con Playwright: entra a la tienda online real books.toscrape.com, extrae productos, precios en vivo y disponibilidad de stock, y captura la pantalla del catálogo."
status: active

trigger:
  id: rpa_trigger
  name: "Disparador de Monitoreo E-Commerce"
  type: trigger_webhook
  config:
    example_payload:
      categoria: "Travel"
      operador: "Analista de Adquisiciones"
      headless: true
    form_fields:
      - name: categoria
        label: "Categoría de Productos"
        type: select
        options:
          - "Travel"
          - "Mystery"
          - "Historical Fiction"
          - "Sequential Art"
          - "Classics"
          - "Philosophy"
        default: "Travel"
        help_text: "Seleccione la categoría de la tienda online que el robot debe inspeccionar."
        required: true
      - name: operador
        label: "Nombre del Operador Responsable"
        type: text
        default: "Analista de Adquisiciones"
        placeholder: "Ej: Juan Pérez / Mesa de Operaciones"
        help_text: "Identificador del personal que solicita la extracción."
        required: true
      - name: headless
        label: "Modo Silencioso (Headless)"
        type: boolean
        default: true
        help_text: "Activar para ejecutar en segundo plano sin desplegar ventana gráfica."

nodes:
  # 1. Automatización Robótica en Vivo con Playwright
  - id: execute_browser_automation
    name: "RPA: Extraer Catálogo y Precios en Vivo"
    type: action_browser
    config:
      url: "https://books.toscrape.com/catalogue/category/books/travel_2/index.html"
      headless: true
      timeout_ms: 15000
      actions:
        - action: "wait_for_selector"
          selector: "ol.row li:nth-child(1) h3 a"
        - action: "extract_text"
          selector: ".page-header h1"
          key: "categoria_catalogo"
        - action: "extract_text"
          selector: "ol.row li:nth-child(1) h3 a"
          key: "producto_1_nombre"
        - action: "extract_text"
          selector: "ol.row li:nth-child(1) .price_color"
          key: "producto_1_precio"
        - action: "extract_text"
          selector: "ol.row li:nth-child(1) .availability"
          key: "producto_1_stock"
        - action: "extract_text"
          selector: "ol.row li:nth-child(2) h3 a"
          key: "producto_2_nombre"
        - action: "extract_text"
          selector: "ol.row li:nth-child(2) .price_color"
          key: "producto_2_precio"
        - action: "extract_text"
          selector: "ol.row li:nth-child(2) .availability"
          key: "producto_2_stock"
        - action: "screenshot"
          path: "screenshots/catalogo_ecommerce_{{trigger.body.categoria}}.png"

  # 2. Consolidar datos extraídos
  - id: format_rpa_summary
    name: "Transform: Consolidar Precios y Stock"
    type: action_transform
    config:
      categoria: "{{execute_browser_automation.extracted.categoria_catalogo}}"
      item_1: "{{execute_browser_automation.extracted.producto_1_nombre}}"
      precio_1: "{{execute_browser_automation.extracted.producto_1_precio}}"
      stock_1: "{{execute_browser_automation.extracted.producto_1_stock}}"
      item_2: "{{execute_browser_automation.extracted.producto_2_nombre}}"
      precio_2: "{{execute_browser_automation.extracted.producto_2_precio}}"
      stock_2: "{{execute_browser_automation.extracted.producto_2_stock}}"
      pantallazo: "{{execute_browser_automation.screenshot_url}}"

  # 3. Guardar registro en la base de datos de auditoría
  - id: init_rpa_db
    name: "SQL: Crear Tabla de Precios E-Commerce"
    type: action_sql
    config:
      query: "CREATE TABLE IF NOT EXISTS price_monitoring (id INTEGER PRIMARY KEY AUTOINCREMENT, category TEXT, item1 TEXT, price1 TEXT, item2 TEXT, price2 TEXT, screenshot TEXT, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"

  - id: save_rpa_record
    name: "SQL: Guardar Reporte de Precios"
    type: action_sql
    config:
      query: "INSERT INTO price_monitoring (category, item1, price1, item2, price2, screenshot) VALUES (?, ?, ?, ?, ?, ?);"
      params:
        - "{{format_rpa_summary.categoria}}"
        - "{{format_rpa_summary.item_1}}"
        - "{{format_rpa_summary.precio_1}}"
        - "{{format_rpa_summary.item_2}}"
        - "{{format_rpa_summary.precio_2}}"
        - "{{format_rpa_summary.pantallazo}}"

  # 4. Registrar en el log del sistema
  - id: log_rpa_completion
    name: "Log: Auditoría Final de Precios"
    type: action_log
    config:
      level: info
      message: "Precios extraídos con éxito de tienda online para categoría {{execute_browser_automation.extracted.categoria_catalogo}}. Item 1: {{execute_browser_automation.extracted.producto_1_nombre}} a {{execute_browser_automation.extracted.producto_1_precio}}. Captura: {{execute_browser_automation.screenshot_url}}"

edges:
  - source: rpa_trigger
    target: execute_browser_automation

  - source: execute_browser_automation
    target: format_rpa_summary

  - source: format_rpa_summary
    target: init_rpa_db

  - source: init_rpa_db
    target: save_rpa_record

  - source: save_rpa_record
    target: log_rpa_completion
