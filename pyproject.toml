[project]
name = "flowengine"
version = "0.1.0"
description = "FlowEngine: Réplica de alto rendimiento del motor de automatizaciones, DAG y Webhooks estilo Zapier / Make"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pyyaml>=6.0.2",
    "aiosqlite>=0.20.0",
]

[project.scripts]
flow = "flowengine.cli.main:app"

[project.entry-points."flowengine.nodes"]
# Los paquetes externos pueden registrar nodos personalizados añadiendo su propia
# sección [project.entry-points."flowengine.nodes"] con pares:
#   nombre_tipo = "mi_paquete.modulo:MiClaseDeNodo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowengine"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "B904"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
